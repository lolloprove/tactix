[project]
name = "tactix-pipeline"
version = "0.1.0"
description = "Tactix ETL: source adapters, tactical engine and AI briefs for Serie A 2026/27."
requires-python = ">=3.12"
dependencies = [
  "curl-cffi>=0.10",
  "google-genai>=1.10",
  "numpy>=2.1",
  "pandas>=2.2",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "supabase>=2.15",
  "tenacity>=9.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "ruff>=0.11",
]

# Application, not a library: uv manages the env, modules run with `uv run python -m ...`
# from this directory (`adapters`, `engine`, `ai`, `db` are top-level packages).
[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
